plugins { id 'com.android.application' }
def releaseProperties = new Properties()
def signingFile = rootProject.file('signing.properties')
if (signingFile.exists()) signingFile.withInputStream { releaseProperties.load(it) }
android {
    namespace 'com.hasan.quizlen'
    compileSdk 36
    defaultConfig {
        applicationId 'com.hasan.quizlen'
        minSdk 23
        targetSdk 36
        versionCode = (project.findProperty('appVersionCode') ?: '1').toInteger()
        versionName = (project.findProperty('appVersionName') ?: '1.0.0')
    }
    signingConfigs {
        release {
            if (signingFile.exists()) {
                storeFile rootProject.file(releaseProperties['storeFile'])
                storePassword releaseProperties['storePassword']
                keyAlias releaseProperties['keyAlias']
                keyPassword releaseProperties['keyPassword']
            }
        }
    }
    buildTypes { release { signingConfig signingConfigs.release; minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_11; targetCompatibility JavaVersion.VERSION_11 }
    sourceSets { main { assets.srcDirs = [layout.buildDirectory.dir('generated/webAssets')] } }
}
tasks.register('syncWebAssets', Sync) {
    from('../..') { include 'index.html', 'css/**', 'js/**', 'data/**' }
    into layout.buildDirectory.dir('generated/webAssets')
}
tasks.named('preBuild').configure { dependsOn 'syncWebAssets' }
dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
